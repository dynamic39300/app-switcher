name: Commercial service and Mac boundaries
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: commerce_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: commerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APPSWITCHER_ENV: test
      DATABASE_URL: postgresql://commerce_ci:isolated-ci-only@127.0.0.1:5432/commerce_ci
      DATABASE_SSLMODE: disable
      PUBLIC_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, established repository pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --project web
      - run: uv run --frozen --project web ruff check web scripts/app_bundle.py scripts/release_manifest.py scripts/test_app_bundle.py scripts/verify_postgres_restore.py
      - run: uv run --frozen --project web ruff format --check web
      - run: uv run --frozen --project web python web/manage.py check
      - run: uv run --frozen --project web python web/manage.py makemigrations --check --dry-run
      - run: uv run --frozen --project web python web/manage.py collectstatic --noinput
      - run: uv run --frozen --project web python web/manage.py test commerce --noinput
      - run: uv run --frozen --project web pip-audit
      - run: node --check web/static/app.js
      - run: python scripts/test_app_bundle.py
      - run: python .framework/scripts/check_framework.py --root .
      - run: git diff --check
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift run CoreTests
      - run: .build/debug/AppSwitcherApp --verify-commerce
      - run: swift build -c release --product AppSwitcherApp
      - run: .build/release/AppSwitcherApp --verify-commerce
      - run: python3 scripts/test_app_bundle.py
      - run: bash -n scripts/build_app.sh scripts/release_macos.sh
      - run: APPSWITCHER_OUTPUT="$RUNNER_TEMP/AppSwitcher.app" scripts/build_app.sh
